<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programs — threats.top</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b; --surface: #111113; --border: #27272a; --border-hover: #3f3f46;
    --text: #fafafa; --text-secondary: #a1a1aa; --text-muted: #71717a;
    --accent: #f97316; --link: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px 80px; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; border-bottom: 1px solid var(--border); margin-bottom: 32px;
  }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .brand span { color: var(--text-muted); font-weight: 400; }
  .back { font-size: 13px; color: var(--text-muted); }
  .back:hover { color: var(--text-secondary); }

  h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.03em;
    margin-bottom: 24px;
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  input, select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 12px;
    outline: none;
  }
  input { flex: 1; min-width: 180px; }
  input:focus, select:focus { border-color: var(--border-hover); }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); font-family: inherit; font-size: 13px;
    padding: 7px 12px; cursor: pointer;
  }
  .tab:hover { border-color: var(--border-hover); color: var(--text-secondary); }
  .tab.active {
    background: var(--surface); border-color: var(--border-hover);
    color: var(--text); font-weight: 500;
  }

  .meta-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted);
    margin-bottom: 12px;
  }
  .meta-bar button {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); font-family: inherit; font-size: 12px;
    padding: 4px 10px; cursor: pointer;
  }
  .meta-bar button:hover { border-color: var(--border-hover); color: var(--text-secondary); }

  .group-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin: 24px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .group-title .n {
    color: var(--text-muted); font-weight: 400; font-size: 12px;
    font-family: 'JetBrains Mono', monospace; margin-left: 8px;
  }

  .card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 6px; background: var(--surface);
    cursor: pointer; transition: border-color 0.12s;
  }
  .card:hover { border-color: var(--border-hover); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card-name { font-weight: 500; font-size: 14px; }
  .card-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .badge {
    font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px;
  }
  .badge.count { color: var(--accent); border-color: rgba(249,115,22,0.35); }
  .badge.manual { color: var(--link); border-color: rgba(56,189,248,0.35); }
  .caret { color: var(--text-muted); font-size: 11px; transition: transform 0.12s; }
  .card.open .caret { transform: rotate(90deg); }
  .card-body {
    display: none; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border); font-size: 12.5px;
    line-height: 1.8; color: var(--text-secondary);
  }
  .card.open .card-body { display: block; }
  .domain-tag {
    display: inline-block; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-right: 4px;
  }
  .copy-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-muted); font-family: inherit; font-size: 11px;
    padding: 3px 8px; cursor: pointer; margin-top: 10px;
  }
  .copy-btn:hover { color: var(--text-secondary); border-color: var(--border-hover); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left; padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  th {
    color: var(--text-muted); font-weight: 500; font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  td.domains {
    color: var(--text-secondary); max-width: 380px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  td.name { font-weight: 500; white-space: nowrap; }
  td.platform { color: var(--text-muted); white-space: nowrap; }

  .pager {
    display: flex; justify-content: center; align-items: center;
    gap: 8px; margin-top: 24px;
  }
  .pager button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); font-family: inherit; font-size: 13px;
    padding: 7px 12px; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { border-color: var(--border-hover); color: var(--text-secondary); }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager span { color: var(--text-muted); font-size: 12px; }

  .empty { color: var(--text-muted); padding: 48px 0; text-align: center; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-secondary); font-size: 13px; padding: 10px 16px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/">threats.top <span>/ programs</span></a>
    <a class="back" href="/">← home</a>
  </nav>

  <h1>Bug bounty programs</h1>

  <div class="controls">
    <input id="search" placeholder="Search program or domain…">
    <select id="sort">
      <option value="domains-desc">Most domains</option>
      <option value="domains-asc">Fewest domains</option>
      <option value="name-asc">Name A–Z</option>
      <option value="platform-asc">Platform</option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="cards">Cards</button>
    <button class="tab" data-view="table">Table</button>
    <button class="tab" data-view="grouped">By platform</button>
  </div>

  <div class="meta-bar">
    <span id="count-label"></span>
    <span>
      <span id="updated-label"></span>
      &nbsp;·&nbsp;
      <button id="copy-md">copy markdown</button>
    </span>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>

<div class="toast" id="toast">copied</div>

<script>
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

const PAGE_SIZE = 30;
let all = [], filtered = [], page = 0, view = 'cards';

fetch('/data/domains.json')
  .then(r => r.json())
  .then(data => {
    all = data.programs || [];
    filtered = all;
    document.getElementById('updated-label').textContent =
      'updated ' + (data.updated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';
    const q = new URLSearchParams(location.search).get('q');
    if (q) {
      document.getElementById('search').value = q;
      const ql = q.toLowerCase();
      filtered = all.filter(p =>
        p.name.toLowerCase().includes(ql) ||
        (p.domains || []).some(d => d.toLowerCase().includes(ql))
      );
    }
    render();
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty">Data unavailable.</div>';
  });

function sortList(list) {
  const mode = document.getElementById('sort').value;
  const copy = [...list];
  if (mode === 'domains-desc') copy.sort((a, b) => (b.domains?.length || 0) - (a.domains?.length || 0));
  if (mode === 'domains-asc') copy.sort((a, b) => (a.domains?.length || 0) - (b.domains?.length || 0));
  if (mode === 'name-asc') copy.sort((a, b) => a.name.localeCompare(b.name));
  if (mode === 'platform-asc') copy.sort((a, b) => (a.platform || '').localeCompare(b.platform || ''));
  return copy;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('copied')).catch(() => showToast('copy failed'));
}

document.getElementById('copy-md').addEventListener('click', () => {
  const list = sortList(filtered);
  const rows = list.map(p =>
    `| ${p.name} | ${p.platform || ''} | ${p.domains.length} | ${p.domains.join(', ')} |`
  );
  copyText('| Program | Platform | Domains | List |\n|---|---|---|---|\n' + rows.join('\n'));
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    page = 0;
    render();
  });
});

function cardHtml(p) {
  const domains = p.domains || [];
  const tags = domains.map(d => `<span class="domain-tag">${esc(d)}</span>`).join(' · ');
  const manual = p.manual ? '<span class="badge manual">manual</span>' : '';
  const attr = domains.join('\n').replace(/"/g, '&quot;');
  return `<div class="card">
    <div class="card-head">
      <span class="card-name">${esc(p.name)}</span>
      <span class="card-badges">
        <span class="badge">${esc(p.platform)}</span>
        ${manual}
        <span class="badge count">${domains.length}</span>
        <span class="caret">▸</span>
      </span>
    </div>
    <div class="card-body">
      ${tags}
      <div><button class="copy-btn" data-domains="${attr}">copy domains</button></div>
    </div>
  </div>`;
}

function bindCards() {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.copy-btn')) return;
      card.classList.toggle('open');
    });
  });
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      copyText(btn.dataset.domains);
    });
  });
}

function render() {
  const sorted = sortList(filtered);
  document.getElementById('count-label').textContent =
    filtered.length + ' program' + (filtered.length === 1 ? '' : 's');
  const list = document.getElementById('list');
  const pager = document.getElementById('pager');

  if (!sorted.length) {
    list.innerHTML = '<div class="empty">No matches.</div>';
    pager.innerHTML = '';
    return;
  }

  if (view === 'grouped') {
    pager.innerHTML = '';
    const groups = {};
    sorted.forEach(p => {
      const k = p.platform || 'Other';
      (groups[k] = groups[k] || []).push(p);
    });
    list.innerHTML = Object.keys(groups).sort().map(k =>
      `<div class="group-title">${esc(k)}<span class="n">${groups[k].length}</span></div>` +
      groups[k].map(cardHtml).join('')
    ).join('');
    bindCards();
    return;
  }

  const start = page * PAGE_SIZE;
  const pageItems = sorted.slice(start, start + PAGE_SIZE);
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));

  if (view === 'table') {
    list.innerHTML = `<table>
      <thead><tr><th>Program</th><th>Platform</th><th>#</th><th>Domains</th></tr></thead>
      <tbody>${pageItems.map(p => `
        <tr>
          <td class="name">${esc(p.name)}</td>
          <td class="platform">${esc(p.platform)}</td>
          <td>${p.domains.length}</td>
          <td class="domains">${p.domains.map(esc).join(', ')}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  } else {
    list.innerHTML = pageItems.map(cardHtml).join('');
    bindCards();
  }

  pager.innerHTML = `
    <button id="prev" ${page === 0 ? 'disabled' : ''}>← prev</button>
    <span>${page + 1} / ${totalPages}</span>
    <button id="next" ${page >= totalPages - 1 ? 'disabled' : ''}>next →</button>`;
  document.getElementById('prev').onclick = () => { page--; render(); scrollTo(0, 0); };
  document.getElementById('next').onclick = () => { page++; render(); scrollTo(0, 0); };
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  filtered = all.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.domains || []).some(d => d.toLowerCase().includes(q))
  );
  page = 0;
  render();
});
document.getElementById('sort').addEventListener('change', () => { page = 0; render(); });
</script>
</body>
</html>
