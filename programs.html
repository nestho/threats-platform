<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Programs — threats.top</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #131922;
    --border: #232b38;
    --text: #c9d3de;
    --text-dim: #6b7688;
    --accent: #ff6b35;
    --accent-dim: #4a9d9c;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    margin: 0;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 24px 60px; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--accent-dim); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    margin: 20px 0 24px;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  input, select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
  }
  input { flex: 1; min-width: 200px; }

  .meta-bar {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 8px;
  }

  .card {
    border: 1px solid var(--border);
    border-top: none;
    padding: 14px 16px;
    cursor: pointer;
  }
  .card:first-of-type { border-top: 1px solid var(--border); }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-name { color: var(--text); font-size: 14px; }
  .card-badges { display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
  }
  .badge.count { color: var(--accent-dim); }
  .caret { color: var(--text-dim); font-size: 12px; transition: transform 0.15s; }
  .card.open .caret { transform: rotate(90deg); }

  .card-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.9;
    color: var(--text-dim);
  }
  .card.open .card-body { display: block; }
  .domain-tag {
    display: inline-block;
    color: var(--text);
    margin-right: 6px;
  }

  /* Placeholders for data types not yet collected — rendered only when present */
  .extra-row { margin-top: 8px; }
  .extra-row .label { color: var(--accent-dim); margin-right: 8px; }

  .pager {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 24px;
  }
  .pager button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .pager button:hover:not(:disabled) { color: var(--accent-dim); }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager span { color: var(--text-dim); font-size: 13px; padding: 8px 4px; }

  .empty { color: var(--text-dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; back</a>
  <h1>Bug bounty programs</h1>

  <div class="controls">
    <input id="search" placeholder="Search program name or domain...">
    <select id="sort">
      <option value="domains-desc">Most domains</option>
      <option value="domains-asc">Fewest domains</option>
      <option value="name-asc">Name A–Z</option>
    </select>
  </div>

  <div class="meta-bar">
    <span id="count-label"></span>
    <span id="updated-label"></span>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>

<script>
const PAGE_SIZE = 30;
let all = [];
let filtered = [];
let page = 0;

fetch('/data/domains.json')
  .then(r => r.json())
  .then(data => {
    all = data.programs || [];
    filtered = all;
    document.getElementById('updated-label').textContent =
      'updated ' + (data.updated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';
    render();
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty">Data not available.</div>';
  });

function sortList(list) {
  const mode = document.getElementById('sort').value;
  const copy = [...list];
  if (mode === 'domains-desc') copy.sort((a, b) => (b.domains?.length || 0) - (a.domains?.length || 0));
  if (mode === 'domains-asc') copy.sort((a, b) => (a.domains?.length || 0) - (b.domains?.length || 0));
  if (mode === 'name-asc') copy.sort((a, b) => a.name.localeCompare(b.name));
  return copy;
}

function render() {
  const sorted = sortList(filtered);
  const start = page * PAGE_SIZE;
  const pageItems = sorted.slice(start, start + PAGE_SIZE);

  document.getElementById('count-label').textContent =
    filtered.length + ' program' + (filtered.length === 1 ? '' : 's');

  const list = document.getElementById('list');
  if (pageItems.length === 0) {
    list.innerHTML = '<div class="empty">No matches.</div>';
  } else {
    list.innerHTML = pageItems.map((p, i) => cardHtml(p, start + i)).join('');
  }

  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  const pager = document.getElementById('pager');
  pager.innerHTML = `
    <button id="prev" ${page === 0 ? 'disabled' : ''}>&larr; prev</button>
    <span>${page + 1} / ${totalPages}</span>
    <button id="next" ${page >= totalPages - 1 ? 'disabled' : ''}>next &rarr;</button>
  `;
  document.getElementById('prev').onclick = () => { page--; render(); window.scrollTo(0,0); };
  document.getElementById('next').onclick = () => { page++; render(); window.scrollTo(0,0); };

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => card.classList.toggle('open'));
  });
}

function cardHtml(p, idx) {
  const domains = p.domains || [];
  const domainTags = domains.map(d => `<span class="domain-tag">${d}</span>`).join(' &middot; ');

  // Future data types render only if present on the record — safe no-op today.
  const extras = [];
  if (p.ports) extras.push(`<div class="extra-row"><span class="label">ports</span>${p.ports.join(', ')}</div>`);
  if (p.tech) extras.push(`<div class="extra-row"><span class="label">tech</span>${p.tech.join(', ')}</div>`);
  if (p.services) extras.push(`<div class="extra-row"><span class="label">services</span>${p.services.join(', ')}</div>`);

  return `
    <div class="card" data-idx="${idx}">
      <div class="card-head">
        <span class="card-name">${p.name}</span>
        <span class="card-badges">
          <span class="badge count">${domains.length} domain${domains.length === 1 ? '' : 's'}</span>
          <span class="caret">&#9656;</span>
        </span>
      </div>
      <div class="card-body">
        ${domainTags}
        ${extras.join('')}
      </div>
    </div>
  `;
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  filtered = all.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.domains || []).some(d => d.toLowerCase().includes(q))
  );
  page = 0;
  render();
});

document.getElementById('sort').addEventListener('change', () => { page = 0; render(); });
</script>
</body>
</html>
