# SonarCloud Automatic Analysis only reads .sonarcloud.properties from the
# default branch; sonar-project.properties is ignored in this mode.

# data/ is generated output, not source. Feed content is validated by
# scripts/validate_feeds.py; running secret and quality rules over committed
# threat data produces false blockers (a phishing URL containing the word
# "token" was reported as a hard-coded credential).
sonar.exclusions=data/**

# The pages repeat their chrome because the site has no template engine and no
# build step; copy-paste detection over static markup therefore reports the
# shared header and footer as duplication. That is a known cost of the static
# architecture, tracked for removal by the component work in the design-system
# workstream, and it is not a correctness or security signal.
sonar.cpd.exclusions=*.html,*/index.html

sonar.sourceEncoding=UTF-8
