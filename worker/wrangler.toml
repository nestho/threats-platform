#:schema node_modules/wrangler/config-schema.json
# Parked legacy admin Worker for threats.top.
#
# The old version wrote to data/manual.json and data/saas_tenants.json through
# the GitHub Contents API, using a PAT and a shared admin password. That was a
# second write path into main and is retired. This version answers /health and
# returns 410 for every legacy route; it reads no secrets and calls no backend.
#
# DEPLOY (only to replace the live dashboard Worker with the fail-closed one)
#   npm i -g wrangler
#   wrangler deploy
#   wrangler secret delete GITHUB_TOKEN
#   wrangler secret delete ADMIN_PASSWORD_HASH
#   wrangler secret delete SAAS_SIGNING_SECRET
#
# Phase 2 replaces this with the D1-backed /api Worker. The route below remains
# so old clients receive an explicit 410 instead of falling through to Pages.

name = "threats-admin"
main = "admin.js"
compatibility_date = "2026-09-27"

# No workers_dev subdomain: a second origin would be an unreviewed entry point.
workers_dev = false

routes = [
  { pattern = "threats.top/admin-api/*", zone_name = "threats.top" },
]

# No observability: this Worker handles no credentials, but request metadata is
# still not worth persisting for a 410 surface.
[observability]
enabled = false
