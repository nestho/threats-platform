#:schema node_modules/wrangler/config-schema.json
# Pro subscriptions API for threats.top.
#
# Serves orders, admin review, licence checks and the STIX export on a dedicated
# API hostname. The static site stays on GitHub Pages and reaches this Worker
# cross-origin with credentials.
#
# DEPLOY
#   npx wrangler d1 create threats-platform
#   npx wrangler d1 migrations apply threats-platform --remote
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put LICENSE_SALT
#   npx wrangler secret put IP_HASH_SALT
#   npx wrangler secret put ADMIN_PASSWORD_HASH   # node ../scripts/admin-credentials.mjs
#   npx wrangler secret put TOTP_SECRET           # same script
#   npx wrangler deploy
#
# Local development
#   npx wrangler d1 migrations apply threats-platform --local
#   npx wrangler dev --local
#   node scripts/smoke.mjs   # end-to-end, uses .dev.vars

name = "threats-platform-api"
main = "src/index.mjs"
compatibility_date = "2026-10-28"

# No workers.dev hostname: the API has exactly one reviewed entry point.
workers_dev = false

routes = [
  { pattern = "api.threats.top", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "threats-platform"
database_id = "SET_AT_DEPLOY"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://threats.top"
ALLOWED_ORIGINS = "https://threats.top"

# Daily housekeeping: expire subscriptions and unpaid orders, prune attempts.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
