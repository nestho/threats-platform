<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulnerabilities — Threats</title>
<meta name="description" content="Recent CVEs, CISA KEV actively exploited vulnerabilities, Exploit-DB exploits, and CERT-EU advisories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 8px; background: var(--surface); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .id { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }
  .id a:hover { color: var(--link); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .desc { color: var(--text-secondary); font-size: 13px; line-height: 1.55; margin-top: 8px; max-width: 720px; }
  .meta-row { color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 8px; }
  .unscored { color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }

  /* GHSA had no UI anywhere before this: it was fetched on the homepage, listed
     in the API catalog, and then never rendered. */
  .badge.ecosystem { color: var(--link); border-color: rgba(56,189,248,0.35); text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="logo" href="/">
      <span class="logo-mark">T</span>
      <span class="logo-name">Threats <span class="sub">/ Vulnerabilities</span></span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/programs.html">Programs</a>
      <a href="/cves.html" aria-current="page">Vulnerabilities</a>
      <a href="/threats.html">Cloud threats</a>
    </nav>
  </header>

  <h1>Vulnerabilities</h1>
  <p class="sub">NVD · CISA KEV · Exploit-DB · CERT-EU · GitHub Advisories</p>

  <div class="tabs" role="tablist" aria-label="Vulnerability source">
    <button class="tab" role="tab" id="tab-recent" aria-controls="list" aria-selected="true" data-view="recent">Recent CVEs</button>
    <button class="tab" role="tab" id="tab-kev" aria-controls="list" aria-selected="false" data-view="kev" tabindex="-1">Actively exploited</button>
    <button class="tab" role="tab" id="tab-exploitdb" aria-controls="list" aria-selected="false" data-view="exploitdb" tabindex="-1">Exploit-DB</button>
    <button class="tab" role="tab" id="tab-cert_eu" aria-controls="list" aria-selected="false" data-view="cert_eu" tabindex="-1">CERT-EU</button>
    <button class="tab" role="tab" id="tab-ghsa" aria-controls="list" aria-selected="false" data-view="ghsa" tabindex="-1">GitHub Advisories</button>
  </div>

  <div class="controls">
    <label for="search" class="visually-hidden">Search vulnerabilities</label>
    <input id="search" type="search" placeholder="Search ID, title, description…" autocomplete="off">
    <label for="sev-filter" class="section-label" style="margin:0;">Severity</label>
    <select id="sev-filter">
      <option value="">All severities</option>
      <option value="CRITICAL">Critical</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
  </div>

  <div class="meta-bar">
    <span id="count-label" role="status" aria-live="polite"></span>
    <span id="updated-label"></span>
  </div>

  <div id="list" role="tabpanel" aria-labelledby="tab-recent"></div>
</div>

<script type="module">
import { esc, timeAgo, timeKey, fetchAll, initTabs, setResultCount } from '/assets/app.js';

let store = {};

function sevClass(severity) {
  if (severity === 'CRITICAL') return 'crit';
  if (severity === 'HIGH') return 'high';
  if (severity === 'MEDIUM') return 'med';
  return '';
}

function recentCard(i) {
  const sev = i.severity
    ? `<span class="badge ${sevClass(i.severity)}">${esc(i.severity)}${i.score != null ? ' ' + esc(i.score) : ''}</span>`
    // ~35% of recent CVEs are genuinely unscored by NVD ("Awaiting Analysis").
    // The old markup showed nothing at all for those, which read as "low
    // priority" rather than "not yet assessed". Say which it is, and which CVSS
    // version produced the number when there is one.
    : '<span class="unscored">unscored by NVD</span>';
  const kev = i.kev ? '<span class="badge kev">exploited</span>' : '';
  const version = i.cvss_version ? ` · CVSS ${esc(i.cvss_version)}` : '';
  return `<article class="card">
    <div class="card-head">
      <h2 class="id"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.id)}</a></h2>
      <div class="badges">${kev}${sev}</div>
    </div>
    <p class="desc">${esc(i.description)}</p>
    <p class="meta-row">${esc(timeAgo(i.published))}${version}</p>
  </article>`;
}

function kevCard(i) {
  // ransomware_use is null when CISA publishes "Unknown"; normalised at the
  // collector so a consumer can test for absence.
  const ransom = i.ransomware_use
    ? '<span class="badge kev">ransomware</span>'
    : '<span class="badge">ransomware: unknown</span>';
  return `<article class="card">
    <div class="card-head">
      <h2 class="id"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.id)}</a></h2>
      <div class="badges"><span class="badge kev">exploited</span>${ransom}</div>
    </div>
    <p class="desc">${esc(i.name)} — ${esc(i.vendor)} / ${esc(i.product)}</p>
    <p class="desc">${esc(i.description)}</p>
    <p class="meta-row">Added to KEV ${esc(i.date_added)}</p>
  </article>`;
}

function edbCard(i) {
  const type = i.type ? `<span class="badge hot">${esc(i.type)}</span>` : '';
  return `<article class="card">
    <div class="card-head">
      <h2 class="id"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">EDB-${esc(i.id)}</a></h2>
      <div class="badges">${type}</div>
    </div>
    <p class="desc">${esc(i.title)}</p>
    <p class="meta-row">${esc(timeAgo(i.published))}</p>
  </article>`;
}

function certCard(i) {
  return `<article class="card">
    <div class="card-head">
      <h2 class="id"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.id)}</a></h2>
      <div class="badges"><span class="badge">CERT-EU</span></div>
    </div>
    <p class="desc">${esc(i.title)}</p>
    ${i.summary ? `<p class="desc">${esc(i.summary)}</p>` : ''}
    <p class="meta-row">${esc(timeAgo(i.published))}</p>
  </article>`;
}

function ghsaCard(i) {
  const eco = i.ecosystem ? `<span class="badge ecosystem">${esc(i.ecosystem)}</span>` : '';
  return `<article class="card">
    <div class="card-head">
      <h2 class="id"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.id)}</a></h2>
      <div class="badges">${eco}</div>
    </div>
    <p class="desc">${esc(i.title)}</p>
    ${i.summary ? `<p class="desc">${esc(i.summary)}</p>` : ''}
    <p class="meta-row">${esc(timeAgo(i.published))}</p>
  </article>`;
}

const VIEWS = {
  recent: {
    key: 'cves',
    card: recentCard,
    empty: 'CVE data unavailable.',
    pick: (d) => d?.recent?.items || [],
    match: (i, q) =>
      i.id.toLowerCase().includes(q) ||
      (i.description || '').toLowerCase().includes(q) ||
      (i.title || '').toLowerCase().includes(q),
  },
  kev: {
    key: 'cves',
    card: kevCard,
    empty: 'KEV data unavailable.',
    pick: (d) => d?.actively_exploited?.items || [],
    match: (i, q) =>
      i.id.toLowerCase().includes(q) ||
      (i.description || '').toLowerCase().includes(q) ||
      (i.vendor || '').toLowerCase().includes(q) ||
      (i.product || '').toLowerCase().includes(q) ||
      (i.name || '').toLowerCase().includes(q),
  },
  exploitdb: {
    key: 'edb',
    card: edbCard,
    empty: 'Exploit-DB unavailable.',
    pick: (d) => d?.items || [],
    match: (i, q) =>
      (i.id || '').toLowerCase().includes(q) ||
      (i.title || '').toLowerCase().includes(q) ||
      (i.type || '').toLowerCase().includes(q),
  },
  cert_eu: {
    key: 'cert',
    card: certCard,
    empty: 'CERT-EU unavailable.',
    pick: (d) => d?.items || [],
    match: (i, q) =>
      (i.id || '').toLowerCase().includes(q) ||
      (i.title || '').toLowerCase().includes(q) ||
      (i.summary || '').toLowerCase().includes(q),
  },
  ghsa: {
    key: 'ghsa',
    card: ghsaCard,
    empty: 'GitHub Advisories unavailable.',
    pick: (d) => d?.items || [],
    match: (i, q) =>
      (i.id || '').toLowerCase().includes(q) ||
      (i.title || '').toLowerCase().includes(q) ||
      (i.ecosystem || '').toLowerCase().includes(q) ||
      (i.summary || '').toLowerCase().includes(q),
  },
};

function currentView() {
  return document.querySelector('.tab[aria-selected="true"]')?.dataset.view || 'recent';
}

function render() {
  const view = currentView();
  const spec = VIEWS[view];
  const source = store[spec.key];
  const list = document.getElementById('list');

  // Severity only applies to the NVD recent list; every other source has no
  // severity concept, so the control is hidden rather than inert.
  const sevSelect = document.getElementById('sev-filter');
  sevSelect.style.display = view === 'recent' ? '' : 'none';

  if (!source) {
    setResultCount(document.getElementById('count-label'), 0, 'result');
    list.innerHTML = `<p class="empty">${esc(spec.empty)}</p>`;
    return;
  }

  const q = document.getElementById('search').value.trim().toLowerCase();
  const sev = view === 'recent' ? sevSelect.value : '';

  let items = spec.pick(source);
  if (q) items = items.filter((i) => spec.match(i, q));
  if (sev) items = items.filter((i) => i.severity === sev);

  setResultCount(document.getElementById('count-label'), items.length, 'result');
  list.innerHTML = items.length
    ? items.map(spec.card).join('')
    : '<p class="empty">No matches.</p>';
}

initTabs('.tabs', (view) => {
  document.getElementById('list').setAttribute('aria-labelledby', `tab-${view}`);
  render();
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('sev-filter').addEventListener('change', render);

const loaded = await fetchAll({
  cves: '/data/cves.json',
  edb: '/data/exploitdb.json',
  cert: '/data/cert_eu.json',
  ghsa: '/data/ghsa.json',
});
store = loaded;

const times = Object.values(loaded).map((d) => d?.updated_at).filter(Boolean);
if (times.length) {
  const oldest = new Date(Math.min(...times.map((t) => new Date(t).getTime()))).toISOString();
  document.getElementById('updated-label').textContent =
    'All sources current as of ' + oldest.slice(0, 10) + ' UTC';
}

const q = new URLSearchParams(location.search).get('q');
if (q) document.getElementById('search').value = q;
render();
</script>
</body>
</html>
