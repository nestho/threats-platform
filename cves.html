<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CVEs — threats.top</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14; --panel: #131922; --border: #232b38;
    --text: #c9d3de; --text-dim: #6b7688; --accent: #ff6b35; --accent-dim: #4a9d9c;
    --crit: #ff4d4d; --high: #ff8c42; --med: #e8c547; --low: #6b7688;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 60px; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--accent-dim); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; margin: 20px 0 8px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    font-family: inherit; font-size: 13px; padding: 8px 14px; cursor: pointer;
  }
  .tab.active { color: var(--accent); border-color: var(--accent-dim); }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  input, select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 13px; padding: 10px 12px;
  }
  input { flex: 1; min-width: 200px; }

  .meta-bar { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }

  .card { border: 1px solid var(--border); border-top: none; padding: 16px; }
  .card:first-of-type { border-top: 1px solid var(--border); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .cve-id { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: var(--text); }
  .cve-id a { color: inherit; text-decoration: none; }
  .cve-id a:hover { color: var(--accent-dim); }
  .badges { display: flex; gap: 6px; flex-shrink: 0; }
  .sev-badge { font-size: 11px; padding: 3px 9px; border: 1px solid; white-space: nowrap; }
  .sev-CRITICAL { color: var(--crit); border-color: var(--crit); }
  .sev-HIGH { color: var(--high); border-color: var(--high); }
  .sev-MEDIUM { color: var(--med); border-color: var(--med); }
  .sev-LOW { color: var(--low); border-color: var(--low); }
  .kev-badge { font-size: 11px; padding: 3px 9px; background: var(--crit); color: #0a0e14; font-weight: 500; }
  .ransomware-badge { font-size: 11px; padding: 3px 9px; background: var(--text); color: #0a0e14; font-weight: 500; }
  .exploit-badge { font-size: 11px; padding: 3px 9px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
  .desc { color: var(--text-dim); font-size: 12.5px; line-height: 1.6; margin-top: 8px; max-width: 800px; }
  .meta-row { color: var(--text-dim); font-size: 11.5px; margin-top: 8px; }
  .empty { color: var(--text-dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; back</a>
  <h1>Vulnerabilities</h1>
  <div class="sub">Recently published CVEs (NVD) and actively exploited vulnerabilities (CISA KEV)</div>

  <div class="tabs">
    <button class="tab active" data-view="recent">Recently published</button>
    <button class="tab" data-view="kev">Actively exploited</button>
  </div>

  <div class="controls">
    <input id="search" placeholder="Search CVE ID or description...">
    <select id="sev-filter" style="display:none;">
      <option value="">All severities</option>
      <option value="CRITICAL">Critical</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
  </div>

  <div class="meta-bar">
    <span id="count-label"></span>
    <span id="updated-label"></span>
  </div>

  <div id="list"></div>
</div>

<script>
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

let data = null;
let view = 'recent';

fetch('/data/cves.json')
  .then(r => r.json())
  .then(d => {
    data = d;
    document.getElementById('updated-label').textContent =
      'updated ' + (d.updated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';

    // Pre-fill search if arriving from the homepage's global search box
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) document.getElementById('search').value = q;

    render();
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty">Data not available.</div>';
  });

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    document.getElementById('sev-filter').style.display = view === 'recent' ? 'block' : 'none';
    render();
  });
});

function recentCard(item) {
  const sevBadge = item.severity ? `<span class="sev-badge sev-${esc(item.severity)}">${esc(item.severity)}${item.score ? ' ' + item.score : ''}</span>` : '';
  const kevBadge = item.kev ? '<span class="kev-badge">ACTIVELY EXPLOITED</span>' : '';
  const exploitBadge = item.exploit_available ? `<span class="exploit-badge">EXPLOIT (${item.exploit_ids.length})</span>` : '';
  return `
    <div class="card">
      <div class="card-head">
        <span class="cve-id"><a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.id)}</a></span>
        <div class="badges">${kevBadge}${exploitBadge}${sevBadge}</div>
      </div>
      <div class="desc">${esc(item.description)}</div>
      <div class="meta-row">published ${esc((item.published || '').slice(0, 10))}</div>
    </div>
  `;
}

function kevCard(item) {
  const ransomBadge = item.ransomware_use === 'Known' ? '<span class="ransomware-badge">RANSOMWARE USE</span>' : '';
  return `
    <div class="card">
      <div class="card-head">
        <span class="cve-id"><a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.id)}</a></span>
        <div class="badges"><span class="kev-badge">ACTIVELY EXPLOITED</span>${ransomBadge}</div>
      </div>
      <div class="desc">${esc(item.name)} &mdash; ${esc(item.vendor)} / ${esc(item.product)}</div>
      <div class="desc">${esc(item.description)}</div>
      <div class="meta-row">added to KEV catalog ${esc(item.date_added)}</div>
    </div>
  `;
}

function render() {
  if (!data) return;
  const q = document.getElementById('search').value.toLowerCase();
  const sevFilter = document.getElementById('sev-filter').value;

  let items, cardFn;
  if (view === 'recent') {
    items = data.recent.items.filter(i =>
      (!q || i.id.toLowerCase().includes(q) || (i.description || '').toLowerCase().includes(q)) &&
      (!sevFilter || i.severity === sevFilter)
    );
    cardFn = recentCard;
  } else {
    items = data.actively_exploited.items.filter(i =>
      !q || i.id.toLowerCase().includes(q) ||
      (i.description || '').toLowerCase().includes(q) ||
      (i.vendor || '').toLowerCase().includes(q) ||
      (i.product || '').toLowerCase().includes(q)
    );
    cardFn = kevCard;
  }

  document.getElementById('count-label').textContent = items.length + ' result' + (items.length === 1 ? '' : 's');
  const list = document.getElementById('list');
  list.innerHTML = items.length ? items.map(cardFn).join('') : '<div class="empty">No matches.</div>';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('sev-filter').addEventListener('change', render);
</script>
</body>
</html>
