name: Validate

# The required gate on every pull request into main.
#
# update-data.yml runs the same feed validator between collection and commit, so
# a bad automated snapshot never reaches a pull request either. This workflow
# also catches hand edits to data/*.json, which is how an empty feed could other-
# wise arrive unnoticed.
#
# Three independent jobs, so a test failure cannot hide a feed failure (or the
# reverse) and all three can be required by name in the ruleset. The fourth job
# (Design detector) is advisory and is deliberately not a required check.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deliberately read-only. The data workflow needs write access, but a pull
# request must never be able to push to main. `pull_request` (not
# `pull_request_target`) runs fork PRs with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job-level so BOTH the fetch and the validate step see it.
#
# The first draft set this only on the fetch step, while the validate step read
# "$BASE_SHA". That expands to an empty string there, and `git show :data/<feed>`
# with an empty ref reads the INDEX rather than the base commit -- so the
# regression check would have silently compared the working tree against itself
# and passed. A gate that cannot fail is worse than no gate.
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  validate-data:
    name: Feed data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the base commit
        # validate_feeds.py's regression check reads the previous version with
        # `git show <ref>:data/<feed>`. A default shallow checkout does not
        # contain the base branch, so fetch exactly that one commit rather than
        # the whole history -- this repo commits data hourly and a full clone
        # grows by megabytes per run.
        #
        # "$BASE_SHA" is quoted and unexpanded, never interpolated as
        # ${{ }} inside the script body: expression substitution in run: is a
        # script-injection vector.
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "BASE_SHA is empty; nothing to compare against (manual dispatch)."
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          echo "base commit fetched: $BASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Timestamp normalisation self-check
        # Runs in a second: asserts every upstream date format still parses and
        # that an unknown timezone is refused rather than guessed.
        run: python3 scripts/normalize.py

      - name: Validate feed data
        # Compares against the base branch, so this answers "did THIS pull
        # request empty or halve a feed" rather than "is the feed empty".
        #
        # A pull request that changes a collector's output shape without
        # regenerating its data will fail here. That coupling is deliberate: it
        # forces a contract change and the data that satisfies it to land
        # together, instead of leaving main in a state where its own gate fails.
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "Manual run: validating against HEAD."
            python3 scripts/validate_feeds.py --against HEAD
          else
            python3 scripts/validate_feeds.py --against "$BASE_SHA"
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # No dependencies. These cover the two places where a silent failure is
      # worst: esc() is the site's only XSS control, and the edge Worker is the
      # only network-facing surface that used to write to main.
      - name: Test
        run: node --test assets worker scheduler

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # scripts/ is the top-level directory so the modules import each other the
      # same way they do when a collector runs from the repository root.
      - name: Test
        run: python3 -m unittest discover -s scripts/tests -t scripts -v

  design:
    name: Design detector
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # The 4.8.0 tarball is fetched and checked against the registry's
      # integrity hash rather than resolved through npx: the version cannot
      # drift, and no lifecycle script runs on the runner. The unpacked CLI
      # lives under .cache/, which is ignored.
      - name: Install scanner
        env:
          TARBALL_SHA512: e0+wbJppJMiQN8npKmIkBbKetfSlarak7OIGlsRhc8folekz4PgStjuprhYi+imjqBb6OCMJLV9II2hHGmcCyg==
        run: |
          set -euo pipefail
          mkdir -p .cache/impeccable
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://registry.npmjs.org/impeccable/-/impeccable-4.8.0.tgz \
            -o .cache/impeccable.tgz
          actual=$(openssl dgst -sha512 -binary .cache/impeccable.tgz | openssl base64 -A)
          if [[ "$actual" != "$TARBALL_SHA512" ]]; then
            echo "::error::Impeccable tarball does not match the pinned integrity hash."
            exit 1
          fi
          tar -xzf .cache/impeccable.tgz -C .cache/impeccable --strip-components=1

      # Advisory on purpose. Findings annotate the pull request and never block
      # a merge, because taste rules must not override a human. A detector that
      # cannot scan (exit 1) does fail the job: a check that silently stops
      # scanning is worse than no check at all.
      - name: Scan pages and styles
        env:
          DO_NOT_TRACK: '1'
          IMPECCABLE_NO_TELEMETRY: '1'
        run: |
          set +e
          node .cache/impeccable/cli/bin/cli.js detect --github --no-advisory ./*.html assets
          code=$?
          set -e
          echo "detector exit: $code"
          if [[ $code -eq 1 ]]; then
            echo "::error::Impeccable could not scan its targets."
            exit 1
          fi
