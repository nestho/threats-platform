name: Update Threat Data

on:
  # Single hourly cron. Which feeds run is decided inside the job
  # based on the current hour (cleaner than many overlapping crons).
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      feed:
        description: 'Feed to update'
        required: true
        type: choice
        options:
          - urlhaus
          - ghsa
          - cve
          - collector
          - exploitdb
          - cert_eu
          - all
        default: all

permissions:
  contents: write

# Serialize all data updates so multiple feeds cannot race
# while committing/pushing to main.
concurrency:
  group: threat-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Select feed(s)
        id: feed
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FEED: ${{ inputs.feed }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            feed="${INPUT_FEED}"
          else
            # Hourly schedule logic (UTC hour):
            #   every hour  -> urlhaus
            #   every 2h    -> cve   (even hours)
            #   every 3h    -> ghsa  (hours % 3 == 0)
            #   every 4h    -> exploitdb + cert_eu
            #   every 6h    -> collector
            HOUR=$(date -u +%H)
            HOUR=$((10#$HOUR))   # force decimal

            feeds=("urlhaus")

            if (( HOUR % 2 == 0 )); then
              feeds+=("cve")
            fi
            if (( HOUR % 3 == 0 )); then
              feeds+=("ghsa")
            fi
            if (( HOUR % 4 == 0 )); then
              feeds+=("exploitdb")
              feeds+=("cert_eu")
            fi
            if (( HOUR % 6 == 0 )); then
              feeds+=("collector")
            fi

            # Join with comma for the next step
            feed=$(IFS=,; echo "${feeds[*]}")
          fi

          echo "feed=${feed}" >> "${GITHUB_OUTPUT}"
          echo "========================================"
          echo "Selected feed(s): ${feed}"
          echo "========================================"

      - name: Update selected feed(s)
        env:
          FEED: ${{ steps.feed.outputs.feed }}
        run: |
          set -euo pipefail

          retry() {
            local attempts=4
            local delay=5
            local attempt=1

            while true; do
              echo "Attempt ${attempt}/${attempts}: $*"
              if "$@"; then
                return 0
              fi
              if (( attempt >= attempts )); then
                echo "::error::Command failed after ${attempts} attempts"
                return 1
              fi
              echo "Command failed. Retrying in ${delay}s..."
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          run_one() {
            case "$1" in
              urlhaus)
                echo "Updating URLhaus..."
                retry python scripts/urlhaus_feed.py
                ;;
              ghsa)
                echo "Updating GitHub Security Advisories..."
                retry python scripts/ghsa_feed.py
                ;;
              cve)
                echo "Updating CVE / CISA KEV..."
                retry python scripts/cve_feed.py
                ;;
              collector)
                echo "Updating ProjectDiscovery programs/domains..."
                retry python scripts/collector.py
                ;;
              exploitdb)
                echo "Updating Exploit-DB..."
                retry python scripts/exploitdb_feed.py
                ;;
              cert_eu)
                echo "Updating CERT-EU..."
                retry python scripts/cert_eu_feed.py
                ;;
              *)
                echo "::error::Unsupported feed: $1"
                return 1
                ;;
            esac
          }

          if [[ "${FEED}" == "all" ]]; then
            for f in collector cve ghsa urlhaus exploitdb cert_eu; do
              run_one "$f"
            done
          else
            # FEED can be a single name or comma-separated list
            IFS=',' read -ra FEEDS <<< "${FEED}"
            for f in "${FEEDS[@]}"; do
              run_one "$(echo "$f" | xargs)"
            done
          fi

      - name: Commit and push
        env:
          FEED: ${{ steps.feed.outputs.feed }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "========================================"
            echo "No data changes for: ${FEED}"
            echo "Nothing to commit."
            echo "========================================"
            exit 0
          fi

          git commit -m "chore(data): update ${FEED} feed(s)"

          git fetch origin main
          git rebase origin/main

          retry_push() {
            local attempts=4
            local delay=5
            local attempt=1

            while true; do
              echo "Push attempt ${attempt}/${attempts}"
              if git push origin HEAD:main; then
                echo "Push successful."
                return 0
              fi
              if (( attempt >= attempts )); then
                echo "::error::git push failed after ${attempts} attempts"
                return 1
              fi
              echo "Push failed. Refreshing main and retrying in ${delay}s..."
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
              git fetch origin main
              git rebase origin/main
            done
          }

          retry_push
