name: Update Threat Data

# Scheduled collection.
#
# This workflow never writes to main. It commits the regenerated snapshot to an
# `automation/data-*` branch and opens a pull request, so automated data goes
# through the same feed validator and tests as a hand edit. The ruleset on main
# requires those checks and has no bypass actors.
#
# Which sources run is decided by each source's cadence in scripts/status.py,
# not by cron arithmetic: a missed hourly run is caught up on the next one, and
# a 12-hour or 30-day source does not depend on its cron minute ever matching.
#
# Three entries per hour, not one: GitHub's schedule trigger is best-effort and
# this repository was seeing roughly six of twenty-four daily events delivered,
# in 2-6 hour gaps. Extra runs that find nothing due cost about 30 seconds and
# publish nothing, and the concurrency group keeps them from overlapping.

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'

  workflow_dispatch:
    inputs:
      feeds:
        description: 'auto (cadence-driven), all, or a comma-separated source id list'
        required: false
        default: auto
        type: string

# Read-only for the checkout token. Write access comes from the data bot's own
# token below, and only for the publish step.
permissions:
  contents: read

concurrency:
  group: threat-data-update
  cancel-in-progress: false

env:
  FEEDS: ${{ github.event.inputs.feeds || 'auto' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # The publish step authenticates the remote with the bot token. If
          # checkout persisted its own read-only token, every push would use
          # that header instead and fail with 403.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      # Secrets cannot be tested in an `if:` expression, so the presence check
      # happens in a shell step that publishes an output.
      - name: Check data bot credentials
        id: credentials
        env:
          APP_ID: ${{ vars.DATA_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint data bot token
        id: app-token
        if: steps.credentials.outputs.use_app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DATA_BOT_APP_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve publish token
        id: bot
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${APP_TOKEN}" ]]; then
            echo "::add-mask::${APP_TOKEN}"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "${FALLBACK_TOKEN}" ]]; then
            echo "::add-mask::${FALLBACK_TOKEN}"
            echo "token=${FALLBACK_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "token=" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No data bot credentials. Set vars.DATA_BOT_APP_ID + secrets.DATA_BOT_PRIVATE_KEY, or secrets.DATA_BOT_TOKEN, to publish. Collectors will still run and be validated."
          fi

      # A bad upstream must not stop the healthy ones. run_collectors.py isolates
      # each source, records failures in data/status.json, and exits non-zero
      # only when a critical source is beyond its hard freshness limit.
      - name: Collect due sources
        id: collect
        continue-on-error: true
        env:
          # GHSA's REST API gives 60 requests/hour unauthenticated and far more
          # with a token. The job token is enough to read public advisories.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/run_collectors.py --feeds "${FEEDS}"

      # The gate. Collectors refuse to replace a feed with invalid data, and this
      # check also compares the result against main, so a source that returns
      # something well-formed but empty still fails instead of emptying the site.
      - name: Validate generated feeds
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/validate_feeds.py --against HEAD

      - name: Detect data changes
        id: changes
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed files changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- data/
          fi

      # Only one automation pull request is kept open at a time. When it exists,
      # the fresh snapshot is pushed onto its branch instead of opening a
      # duplicate; the pull request checks then re-run against the new snapshot.
      - name: Publish data pull request
        id: publish
        if: steps.changes.outputs.changed == 'true' && steps.bot.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "threats-data-bot"
          git config user.email "threats-data-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          existing="$(gh pr list --state open --base main --json headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/data-")) | .headRefName' \
            | head -n 1)"

          if [[ -n "${existing}" ]]; then
            branch="${existing}"
            snapshot="$(mktemp -d)"
            cp -R data/. "${snapshot}/"
            # Return the worktree to main before moving onto the PR branch. The
            # generated snapshot is already copied aside.
            git checkout -- data/
            git clean -fdq data/
            git fetch --depth=1 origin "${branch}"
            git checkout -B "${branch}" FETCH_HEAD
            rsync -a --delete "${snapshot}/" data/
            rm -rf "${snapshot}"
          else
            branch="automation/data-$(date -u +%Y%m%d-%H%M)"
            git checkout -b "${branch}"
          fi

          git add -A data/
          if git diff --cached --quiet; then
            echo "The automation branch already contains this snapshot; nothing to publish."
            exit 0
          fi

          stamp="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): refresh feeds ${stamp}"
          git push -u origin "${branch}"

          if [[ -n "${existing}" ]]; then
            echo "Updated the open automation pull request branch ${branch}; checks will re-run."
            exit 0
          fi

          overall="$(python3 -c 'import json; print(json.load(open("data/status.json"))["overall"])')"
          {
            echo "Automated feed refresh from \`update-data.yml\`."
            echo
            echo "- Sources requested: \`${FEEDS}\`"
            echo "- Source health: \`${overall}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "The \`Feed data\` check compares this snapshot against \`main\`. The pull request merges automatically once every required check passes."
          } > /tmp/pr-body.md

          pr_url="$(gh pr create --base main --head "${branch}" \
            --title "chore(data): refresh feeds ${stamp}" \
            --body-file /tmp/pr-body.md)"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

          if ! gh pr merge --auto --squash --delete-branch "${pr_url}"; then
            echo "::warning::Auto-merge could not be enabled. The pull request is open and still gated by the required checks: ${pr_url}"
          fi

      # Publication happens before this so a partial outage still ships the
      # healthy feeds, but the run goes red: an outage that only disappears into
      # a stale feed is exactly the failure mode this workflow exists to stop.
      - name: Fail on critical collector outage
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::A critical source is beyond its hard freshness limit, or a collector could not start. Healthy feeds were still published; see the collection log and /status.html."
          exit 1
