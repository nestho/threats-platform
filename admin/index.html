<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — threats.top</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14; --panel: #131922; --border: #232b38;
    --text: #c9d3de; --text-dim: #6b7688; --accent: #ff6b35; --accent-dim: #4a9d9c;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 60px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin: 20px 0 24px; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--accent-dim); margin: 16px 0 6px; }
  input, textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 13px; padding: 10px 12px;
  }
  textarea { min-height: 100px; resize: vertical; }
  button {
    margin-top: 20px; background: var(--panel); border: 1px solid var(--accent-dim); color: var(--accent-dim);
    font-family: inherit; font-size: 14px; padding: 10px 18px; cursor: pointer;
  }
  button:hover { color: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  .status { margin-top: 14px; font-size: 13px; color: var(--text-dim); }
  .status.ok { color: var(--accent-dim); }
  .status.err { color: var(--accent); }
  .gate { max-width: 320px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; back</a>
  <h1>Add / update a program</h1>

  <div id="gate" class="gate">
    <label>Admin password</label>
    <input id="password" type="password" placeholder="password">
    <button id="unlock">Unlock</button>
    <div class="status" id="gate-status"></div>
  </div>

  <div id="form" style="display:none;">
    <label>Program name</label>
    <input id="name" placeholder="e.g. Acme Corp">
    <label>Program URL (optional)</label>
    <input id="progurl" placeholder="https://acme.com/security">
    <label>Platform</label>
    <input id="platform" placeholder="e.g. HackerOne, Self-hosted / Other">
    <label>Domains (one per line)</label>
    <textarea id="domains" placeholder="acme.com&#10;sub.acme.com"></textarea>
    <button id="submit">Save</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
// Set this to your deployed Worker URL, e.g. https://threats-admin.yoursubdomain.workers.dev
const WORKER_URL = "REPLACE_WITH_YOUR_WORKER_URL";
let pw = "";

document.getElementById('unlock').addEventListener('click', async () => {
  const candidate = document.getElementById('password').value;
  const gateStatus = document.getElementById('gate-status');
  const unlockBtn = document.getElementById('unlock');

  if (!candidate) {
    gateStatus.textContent = 'enter a password first';
    gateStatus.className = 'status err';
    return;
  }

  unlockBtn.disabled = true;
  gateStatus.textContent = 'checking...';
  gateStatus.className = 'status';

  try {
    // Real check: ask the Worker to confirm this password actually works,
    // instead of just hiding/showing UI locally with no verification.
    const resp = await fetch(WORKER_URL + '/list', {
      method: 'GET',
      headers: { 'X-Admin-Password': candidate },
    });

    if (resp.status === 401) {
      gateStatus.textContent = 'wrong password';
      gateStatus.className = 'status err';
      unlockBtn.disabled = false;
      return;
    }
    if (!resp.ok) {
      gateStatus.textContent = 'error contacting server';
      gateStatus.className = 'status err';
      unlockBtn.disabled = false;
      return;
    }

    pw = candidate;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('form').style.display = 'block';
  } catch (e) {
    gateStatus.textContent = 'could not reach server';
    gateStatus.className = 'status err';
    unlockBtn.disabled = false;
  }
});

document.getElementById('submit').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.textContent = 'saving...';
  status.className = 'status';

  const payload = {
    name: document.getElementById('name').value.trim(),
    url: document.getElementById('progurl').value.trim(),
    platform: document.getElementById('platform').value.trim(),
    domains: document.getElementById('domains').value
      .split('\n').map(d => d.trim()).filter(Boolean),
  };

  try {
    const resp = await fetch(WORKER_URL + '/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pw },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'failed');
    status.textContent = 'saved. it will appear on the site after the next data sync.';
    status.className = 'status ok';
    document.getElementById('name').value = '';
    document.getElementById('progurl').value = '';
    document.getElementById('platform').value = '';
    document.getElementById('domains').value = '';
  } catch (e) {
    status.textContent = 'error: ' + e.message;
    status.className = 'status err';
  }
});
</script>
</body>
</html>
